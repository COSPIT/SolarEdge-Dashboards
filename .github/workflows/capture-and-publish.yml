name: Capture and publish SolarEdge dashboards

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Every 15 minutes, deliberately avoiding the start of the hour.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solaredge-pages
  cancel-in-progress: true

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Capture the four SolarEdge dashboards
        run: npm run capture

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: capture
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
