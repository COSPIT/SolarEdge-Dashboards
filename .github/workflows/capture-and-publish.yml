name: Capture and publish SolarEdge dashboards

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solaredge-pages
  cancel-in-progress: true

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Capture the four SolarEdge dashboards
        run: npm run capture

      - name: Prepare GitHub Pages content
        run: |
          touch public/.nojekyll

      - name: Publish to gh-pages branch
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          cd public

          git init
          git config user.name "SolarEdge Dashboard Bot"
          git config user.email "124332620+COSPIT@users.noreply.github.com"

          git checkout -b gh-pages

          git add --all

          git commit \
            -m "Update SolarEdge dashboards $(TZ=Australia/Perth date '+%Y-%m-%d %H:%M:%S %Z')"

          git remote add origin \
            "https://x-access-token:${PAGES_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin gh-pages
