<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1"
  >

  <title>SolarEdge Dashboards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      color: #fff;
      background: #101820;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 38px;
    }

    .site {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin: 14px 0;
      padding: 22px 24px;
      color: #fff;
      text-decoration: none;
      background: #1d2b36;
      border-radius: 10px;
    }

    .site:hover {
      background: #263a49;
    }

    .site span {
      font-size: 22px;
      font-weight: 600;
    }

    .site small {
      color: #b8c4ce;
      text-align: right;
    }
  </style>
</head>

<body>
  <main>
    <h1>SolarEdge Dashboards</h1>
    
        <a
          class="site"
          href="./operations-depot/"
        >
          <span>Operations Depot</span>
          <small>Current</small>
        </a>
        <a
          class="site"
          href="./manning-community-centre/"
        >
          <span>Manning Community Centre</span>
          <small>Current</small>
        </a>
        <a
          class="site"
          href="./south-perth-library/"
        >
          <span>South Perth Library</span>
          <small>Current</small>
        </a>
        <a
          class="site"
          href="./civic-centre/"
        >
          <span>Civic Centre</span>
          <small>Current</small>
        </a>
  </main>
</body>
</html>
